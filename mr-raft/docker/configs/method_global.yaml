regions:
  - id: 1
    name: "Global-Region"


benchmark:
  duration: 60s
  # 1个region，每个region 10 clients = 10 total clients（最低负载）
  clients_per_region: [10, 20, 30, 40]  # 多个客户端数量，依次测试
  base_port: 30000
  # optimization_level: Default
  data_dir: /data
  proposal_size: 128
  method_name: "global"  # 方法名称，用于容器命名

resources:
  # Leader节点资源配置（第一个节点）
  leader_cpu_limit: "4.0"            # CPU限制：4个核心
  leader_memory_limit: "2G"          # 内存限制：2GB
  leader_cpu_reservation: "2.0"      # CPU预留：2个核心
  leader_memory_reservation: "1G"    # 内存预留：1GB
  # Follower节点资源配置（其他节点）
  follower_cpu_limit: "4.0"          # CPU限制：2个核心
  follower_memory_limit: "2G"        # 内存限制：2GB
  follower_cpu_reservation: "2.0"    # CPU预留：1个核心
  follower_memory_reservation: "1G" # 内存预留：512MB

